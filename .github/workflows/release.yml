name: Release

# Publishes to crates.io when cargo-release pushes a vX.Y.Z tag (see RELEASING.md).
# Runs on the SDK runner so `cargo publish` does a real verification build and
# the test suite gates the release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for crates.io Trusted Publishing (OIDC)

jobs:
  publish:
    name: publish to crates.io
    runs-on: [self-hosted, noesis-sdk]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Never publish a build verified against a different SDK version.
      - name: Verify Noesis SDK version
        run: |
          grep -Fxq "3.2.13 (r17073)" "$NOESIS_SDK_DIR/version.txt" || {
            echo "::error::Runner '$RUNNER_NAME' has an unexpected Noesis SDK at $NOESIS_SDK_DIR:"
            cat "$NOESIS_SDK_DIR/version.txt"
            exit 1
          }

      - name: cargo test
        run: cargo test --all-features

      # Skip if this version is already on crates.io, so a re-run stays green.
      - name: Check if version already published
        id: check
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: noesis_runtime-release' \
            "https://crates.io/api/v1/crates/noesis_runtime/$ver")
          if [ "$code" = "200" ]; then
            echo "noesis_runtime $ver is already on crates.io; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to crates.io (Trusted Publishing)
        if: steps.check.outputs.skip != 'true'
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: cargo publish
        if: steps.check.outputs.skip != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
